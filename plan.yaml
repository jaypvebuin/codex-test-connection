version: 0.2

phases:
  install: 
    on-failure: ABORT
    commands: 
      - echo ".......Installing Terraform......."
      - sudo apt-get update && sudo apt-get install -y gnupg software-properties-common
      -  echo "Install the HashiCorp GPG key"
      - wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor | sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg
      - echo "Verify the GPG key's fingerprint"
      - gpg --no-default-keyring --keyring /usr/share/keyrings/hashicorp-archive-keyring.gpg --fingerprint
      - echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
      - sudo apt update
      - echo "sudo apt-get install terraform -y"
      - sudo apt-get install terraform -y 
      - echo ".....Terraform version......."
      - terraform --version
      # - echo "Installing Infra cost"
      # - curl -fsSL https://raw.githubusercontent.com/infracost/infracost/master/scripts/install.sh | sh 
      # - echo "Infracost version"
      # - infracost --version # Should show 0.10.13

  pre_build: 
    on-failure: ABORT
    commands: 
      - echo ".......Terraform Init........."
      - cd live/
      - terraform init -backend-config=$env/backend.tfvars --upgrade
      # set env as codebuild variable
      
  build:
    on-failure: ABORT
    commands: 
      - echo $CODEBUILD_RESOLVED_SOURCE_VERSION
      - terraform plan -var="s3_prefix=$CODEBUILD_RESOLVED_SOURCE_VERSION" -var-file=$env/terraform.tfvars -out tfplan.binary 
      - terraform show -json tfplan.binary > plan-$CODEBUILD_START_TIME.json
      - aws s3 cp plan-$CODEBUILD_START_TIME.json  s3://$s3_bucket/tfplan/$(date +%Y-%m-%d)/
      # - infracost configure set api_key $infracost_api
      # - echo "cost estimation of resources"
      # - infracost diff --path plan-$CODEBUILD_START_TIME.json --show-skipped
      # # below commands save output files of infracost
      # - infracost breakdown --path plan-$CODEBUILD_START_TIME.json --format json --out-file infracost.json
      # - infracost output --path infracost.json --format html --out-file infracost-$CODEBUILD_START_TIME.html --show-skipped
      # - echo "uploading the infracost report in S3"
      # - aws s3 cp infracost-$CODEBUILD_START_TIME.html s3://$s3_bucket/jugaad/infracost/$(date +%Y-%m-%d)/
    
artifacts:
  files:
    - '**/*'